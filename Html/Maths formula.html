<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Table</title>
</head>

<body>
    <h2>Maths formula</h2>
    <table border="1" cellpadding="5" cellspacing="5">
        <tr>
            <th>Name of the solid</th>
            <th>Figure</th>
            <th>Volume</th>
            <th>Curved Surface Area</th>
            <th>Total Surface Area</th>
        </tr>
        <tr>
            <td>Cube</td>
            <td><img src="./assests/cube.png" alt="Cube" width="100" height="100"></td>
            <td>
                <p>a<sup>3</sup></p>
            </td>
            <td>
                <p>4a<sup>2</sup></p>
            </td>
            <td>
                <p>6a<sup>2</sup></p>
            </td>
        </tr>
        <tr>
            <td>Cuboid</td>
            <td><img src="./assests/cuboid.png" alt="Cuboid" width="100" height="100"></td>
            <td>
                <p>l × b × h</p>
            </td>
            <td>
                <p>2h(l + b)</p>
            </td>
            <td>
                <p>2(lb + bh + hl)</p>
            </td>
        </tr>
        <tr>
            <td>Cylinder</td>
            <td><img src="./assests/cylinder.png" alt="Cylinder" width="100" height="100"></td>
            <td>
                <p>πr<sup>2</sup>h</p>
            </td>
            <td>
                <p>2πrh</p>
            </td>
            <td>
                <p>2πr(h + r)</p>
            </td>
        </tr>
        <tr>
            <td>Cone</td>
            <td><img src="./assests/cone.png" alt="Cone" width="100" height="100"></td>
            <td>
                <p>(1/3)πr<sup>2</sup>h</p>
            </td>
            <td>
                <p>πrl</p>
            </td>
            <td>
                <p>πr(r + l)</p>
            </td>
        </tr>
        <tr>
            <td>Sphere</td>
            <td><img src="./assests/sphere.png" alt="Sphere" width="100" height="100"></td>
            <td>
                <p>(4/3)πr<sup>3</sup></p>
            </td>
            <td>
                <p>4πr<sup>2</sup></p>
            </td>
            <td>
                <p>4πr<sup>2</sup></p>
            </td>
        </tr>
        <tr>
            <td>Hemisphere</td>
            <td><img src="./assests/hemisphere.png" alt="Hemisphere" width="100" height="100"></td>
            <td>
                <p>(2/3)πr<sup>3</sup></p>
            </td>
            <td>
                <p>2πr<sup>2</sup></p>
            </td>
            <td>
                <p>3πr<sup>2</sup></p>
            </td>
        </tr>
    </table>
</body>

</html>
